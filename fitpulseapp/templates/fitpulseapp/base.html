{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLife Studio | Gestión de Clientes</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Estilos personalizados: Negro y Naranjo -->
    <style>
        :root {
            --negro-fondo: #000000;
            --negro-tarjeta: rgba(10, 10, 10, 0.90);
            --naranjo-principal: #ff6b00;
            --naranjo-hover: #ff8533;
            --texto-blanco: #ffffff;
            --texto-gris: #b0b0b0;
            --borde-oscuro: #222222;
        }

        body {
            background-color: var(--negro-fondo);
            color: var(--texto-blanco);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        /* Barra de navegación negra con borde naranja */
        .navbar-fitpulse {
            background-color: #000000 !important;
            border-bottom: 2px solid var(--naranjo-principal);
            padding: 16px 0;
        }

        .navbar-fitpulse .navbar-brand {
            color: var(--texto-blanco);
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: 2px;
        }

        .navbar-fitpulse .nav-link {
            color: var(--texto-gris) !important;
            margin-left: 15px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .navbar-fitpulse .nav-link:hover,
        .navbar-fitpulse .nav-link:focus {
            color: var(--naranjo-principal) !important;
        }

        /* Botón superior de navegación */
        .btn-unete {
            background-color: transparent;
            color: var(--texto-blanco);
            border: 2px solid var(--texto-blanco);
            border-radius: 30px;
            padding: 6px 20px;
            font-weight: bold;
            margin-left: 15px;
            transition: all 0.2s ease;
        }

        .btn-unete:hover {
            background-color: var(--naranjo-principal);
            color: var(--texto-blanco);
            border-color: var(--naranjo-principal);
        }

        /* Sección principal con imagen de fondo clara y visible */
        .hero-portada {
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.65)), 
                              url("{% static 'fondo.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: calc(100vh - 80px);
            padding: 50px 0;
            display: flex;
            align-items: center;
        }

        /* Contenedores de formularios y tablas (Tarjetas) */
        .card {
            background-color: var(--negro-tarjeta) !important;
            color: var(--texto-blanco) !important;
            border: 1px solid var(--borde-oscuro) !important;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(6px);
        }

        .card-header {
            background-color: #050505 !important;
            border-bottom: 1px solid var(--borde-oscuro) !important;
            padding: 18px 20px;
        }

        /* Botón de envío / Guardar siempre naranja y bien visible */
        .btn-primary,
        .btn-lima,
        button[type="submit"] {
            background-color: var(--naranjo-principal) !important;
            color: var(--texto-blanco) !important;
            border: 1px solid var(--naranjo-principal) !important;
            border-radius: 8px;
            font-weight: bold;
            padding: 10px 22px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover,
        .btn-lima:hover,
        button[type="submit"]:hover,
        .btn-primary:focus,
        button[type="submit"]:focus {
            background-color: var(--naranjo-hover) !important;
            border-color: var(--naranjo-hover) !important;
            color: var(--texto-blanco) !important;
            box-shadow: 0 0 12px rgba(255, 107, 0, 0.5) !important;
        }

        /* Botón cancelar */
        .btn-outline-light {
            border: 1px solid #444444;
            color: var(--texto-blanco);
        }
        
        .btn-outline-light:hover {
            background-color: #222222;
            border-color: #666666;
            color: var(--texto-blanco);
        }

        /* Tablas */
        .table {
            --bs-table-bg: rgba(10, 10, 10, 0.85);
            --bs-table-color: var(--texto-blanco);
            --bs-table-border-color: var(--borde-oscuro);
            --bs-table-hover-bg: #141414;
            color: var(--texto-blanco);
        }

        .table thead th {
            background-color: #050505;
            color: var(--naranjo-principal);
            border-bottom: 2px solid var(--naranjo-principal);
        }

        /* Campos de texto de formularios */
        .form-control,
        .form-select {
            background-color: #000000 !important;
            color: var(--texto-blanco) !important;
            border: 1px solid #333333 !important;
            border-radius: 6px;
            padding: 10px 12px;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #000000 !important;
            color: var(--texto-blanco) !important;
            border-color: var(--naranjo-principal) !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 107, 0, 0.25) !important;
        }
        
        label {
            color: var(--texto-blanco);
            font-weight: 500;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-fitpulse">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_clientes' %}">FITLIFE STUDIO</a>
            <button class="navbar-toggler bg-dark border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listar_clientes' %}">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Login</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'agregar_cliente' %}" class="btn btn-unete">ÚNETE A NUESTRO GIMNASIO</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Envoltorio con la foto de la modelo de fondo -->
    <div class="hero-portada">
        <main class="container">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
