{% extends 'fitpulseapp/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg primary text-white">
                <h4 class="mb-0">Registrar Nuevo Cliente</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    {{ form.as_p }}
                    <div class="d-flex justify-content-betwen mt-4">
                        <a href="{% url 'listar_clientes' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-sucess">Guardar Cliente</button>  
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
