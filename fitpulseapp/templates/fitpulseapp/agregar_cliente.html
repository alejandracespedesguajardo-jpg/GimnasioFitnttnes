{% extends 'fitpulseapp/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-dark text-white border-bottom border-warning">
                    <h3 class="mb-0 fw-bold" style="color: #ff6b00;">Registrar Nuevo Cliente</h3>
                </div>
                <div class="card-body p-4">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        
                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary">
                            <a href="{% url 'listar_clientes' %}" class="btn btn-outline-light px-4">Cancelar</a>
                            
                            <!-- Botón con color naranja fijo y texto blanco para evitar que se pierda -->
                            <button type="submit" class="btn fw-bold px-4 shadow" style="background-color: #ff6b00 !important; color: #ffffff !important; border: 1px solid #ff6b00 !important;">
                                Guardar Cliente
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
